{% extends 'base.html' %}

{% block title %}Borrowing Capacity Calculator - Finance Tools{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-lg-10 col-xl-8 mx-auto">
        <h2 class="text-center mb-4">Borrowing Capacity Calculator</h2>

        <div class="card border-primary shadow-sm">
            <div class="card-body bg-light">
                <button type="button" class="collapse-toggle btn btn-link p-0 w-100 d-flex justify-content-between align-items-center text-decoration-none"
                        data-bs-toggle="collapse" data-bs-target="#borrowingDetails"
                        aria-expanded="true" aria-controls="borrowingDetails">
                    <h5 class="card-title text-primary mb-0">Borrowing Capacity Details</h5>
                    <i class="bi bi-chevron-up text-primary"></i>
                </button>
                <div id="borrowingDetails" class="collapse show">
                <form id="affordabilityForm" class="mt-3">
                    <div class="row">
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="paymentFrequency">Payment Frequency *</label>
                                <select id="paymentFrequency" class="form-select form-select-lg">
                                    <option value="monthly">Monthly</option>
                                    <option value="weekly">Weekly</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="paymentAmount" id="paymentLabel">
                                    Monthly Payment Amount ($) *
                                </label>
                                <input type="text" inputmode="numeric" id="paymentAmount" class="form-control form-control-lg"
                                       placeholder="e.g., 2,500" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="interestRate">Interest Rate (%) *</label>
                                <input type="number" id="interestRate" step="0.01" class="form-control form-control-lg"
                                       placeholder="e.g., 5.5">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-calculator"></i> Calculate Borrowing Capacity
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>

        <!-- Results Container (populated by JavaScript) -->
        <div id="resultsContainer"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/calculators/affordability.js"></script>
{% endblock %}
