{% extends 'base.html' %}

{% block title %}Refinance Calculator - Finance Tools{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-xl-10 mx-auto">
        <h2 class="text-center mb-4">Refinance Calculator</h2>

        <div class="card border-primary shadow-sm">
            <div class="card-body bg-light">
                <button type="button" class="collapse-toggle btn btn-link p-0 w-100 d-flex justify-content-between align-items-center text-decoration-none"
                        data-bs-toggle="collapse" data-bs-target="#refinanceDetails"
                        aria-expanded="true" aria-controls="refinanceDetails">
                    <h5 class="card-title text-primary mb-0">Loan Details</h5>
                    <i class="bi bi-chevron-up text-primary"></i>
                </button>
                <div id="refinanceDetails" class="collapse show">
                <form id="refinanceForm" class="mt-3">
                    <h6 class="text-primary fw-bold mb-3">Current Loan Details</h6>

                    <div class="row">
                        <div class="col-12 col-md-6 col-lg-3">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="currentOutstandingAmount">Outstanding Amount ($) *</label>
                                <input type="text" inputmode="numeric" id="currentOutstandingAmount" class="form-control form-control-lg"
                                       placeholder="e.g., 350,000" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="currentInterestRate">Interest Rate (%) *</label>
                                <input type="number" id="currentInterestRate" step="0.01" class="form-control form-control-lg"
                                       placeholder="e.g., 6.5">
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="currentPaymentAmount" id="currentPaymentLabel">
                                    Monthly Payment ($) *
                                </label>
                                <input type="text" inputmode="numeric" id="currentPaymentAmount" class="form-control form-control-lg"
                                       placeholder="e.g., 2,400" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="currentPaymentFrequency">Payment Frequency *</label>
                                <select id="currentPaymentFrequency" class="form-select form-select-lg">
                                    <option value="monthly">Monthly</option>
                                    <option value="weekly">Weekly</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h6 class="text-success fw-bold mb-3">New Loan Details</h6>

                    <div class="row">
                        <div class="col-12 col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">New Interest Rate (%) *</label>
                                <input type="number" id="newInterestRate" step="0.01" class="form-control form-control-lg"
                                       placeholder="e.g., 5.2">
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">New Loan Term (years) *</label>
                                <input type="number" id="newLoanTerm" class="form-control form-control-lg"
                                       placeholder="e.g., 25">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-calculator"></i> Compare Refinance Options
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>

        <!-- Results Container (populated by JavaScript) -->
        <div id="resultsContainer"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/calculators/refinance.js"></script>
{% endblock %}
