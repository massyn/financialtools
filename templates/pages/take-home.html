{% extends 'base.html' %}

{% block title %}Take Home Pay Calculator - Finance Tools{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-xl-10 mx-auto">
        <h2 class="text-center mb-4">Take Home Pay Calculator</h2>

        <div class="card border-primary shadow-sm">
            <div class="card-body bg-light">
                <button type="button" class="collapse-toggle btn btn-link p-0 w-100 d-flex justify-content-between align-items-center text-decoration-none"
                        data-bs-toggle="collapse" data-bs-target="#salaryDetails"
                        aria-expanded="true" aria-controls="salaryDetails">
                    <h5 class="card-title text-primary mb-0">Salary Details</h5>
                    <i class="bi bi-chevron-up text-primary"></i>
                </button>
                <div id="salaryDetails" class="collapse show">
                <form id="takeHomeForm" class="mt-3">
                    <div class="row">
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="annualSalary">Annual Salary ($) *</label>
                                <input type="text" inputmode="numeric" id="annualSalary" class="form-control form-control-lg"
                                       placeholder="e.g., 75,000" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="taxYear">Tax Year *</label>
                                <select id="taxYear" class="form-select form-select-lg">
                                    {% for year in tax_data.rates.keys()|sort(reverse=True) %}
                                    <option value="{{ year }}">{{ year }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="medicareLevy">Pay Medicare Levy? *</label>
                                <select id="medicareLevy" class="form-select form-select-lg">
                                    <option value="yes">Yes - Standard rate</option>
                                    <option value="no">No - Exempt</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="includesSuper">Does salary include super? *</label>
                                <select id="includesSuper" class="form-select form-select-lg">
                                    <option value="yes" selected>Yes - Salary includes super</option>
                                    <option value="no">No - Salary excludes super</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="salarySacrifice">Salary Sacrifice to Super (%)</label>
                                <input type="number" id="salarySacrifice" class="form-control form-control-lg"
                                       value="0" placeholder="e.g., 5" min="0" max="100" step="0.5">
                                <small class="form-text text-muted">Optional. Reduces your taxable income.</small>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-calculator"></i> Calculate Take Home Pay
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>

        <!-- Results Container (populated by JavaScript) -->
        <div id="resultsContainer"></div>
    </div>
</div>

<!-- Inject tax data for JavaScript -->
<script>
window.TAX_DATA = {{ tax_data|tojson }};
</script>
{% endblock %}

{% block scripts %}
<script src="/static/js/calculators/takehome.js"></script>
{% endblock %}
